/* vùng đầu trang giữ nền sáng cho logo rõ, phía dưới tối dần để dễ đọc chữ */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) var(--hh),rgba(0,0,0,var(--dim)) calc(var(--hh) + 220px),rgba(0,0,0,var(--dim)) 100%)}
h1,h2{margin:0;font-weight:800}
a,button{font:inherit;cursor:pointer}
input,select{
  background:var(--bg);color:var(--tx);border:1px solid var(--bd);
  border-radius:12px;padding:12px 14px;width:100%;font:inherit;min-height:46px;
}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
button{
  background:var(--red);color:#fff;border:0;border-radius:12px;
  padding:12px 16px;font-weight:700;min-height:46px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .05s ease,opacity .15s;
}
button:active{transform:scale(.97);opacity:.9}
button.g{background:var(--hi);border:1px solid var(--bd)}
button.d{background:#7f1d1d}
button.x.e{background:var(--hi);border:1px solid var(--bd)}
button.x{background:#7f1d1d;padding:4px 10px;margin-left:6px;font-size:12px;border-radius:8px;min-height:auto}
.w{max-width:1000px;margin:0 auto;padding:var(--pad)}
/* ô chức năng: nền mờ hơn, làm nhòe ảnh phía sau */
.card,.mc{background:rgba(17,17,17,var(--card-alpha));border:1px solid rgba(255,255,255,.12);border-radius:var(--rad);
  -webkit-backdrop-filter:blur(var(--card-blur)) saturate(1.1);backdrop-filter:blur(var(--card-blur)) saturate(1.1)}
.card{padding:16px;margin-bottom:14px}
.mu,small.mu{color:var(--mu)}
.gold{color:var(--gold);font-weight:800}

header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.28);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,0,0,.08);padding-top:env(safe-area-inset-top)}
header .w{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px var(--pad)}
header input{background:rgba(0,0,0,.6);border-color:rgba(255,255,255,.18);min-height:52px}
header input::placeholder{color:#cfcfcf}
.logo{height:76px;width:76px;border-radius:18px;object-fit:cover;cursor:pointer;display:block;border:1px solid rgba(0,0,0,.12);box-shadow:0 6px 18px rgba(0,0,0,.28)}
.logo-big{width:180px;height:180px;border-radius:24px;object-fit:cover;display:block;margin:0 auto 16px}
.brandbox{display:flex;align-items:center;gap:14px;cursor:pointer}
/* chữ DICTATOR bên phải logo */
.wm{height:58px;width:auto;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.22))}
@media(max-width:700px){:root{--hh:170px}}
@media(max-width:520px){.logo{height:60px;width:60px;border-radius:15px}.wm{height:44px}.iconbtn{width:48px;height:48px}}
.spacer{flex:1}
.iconbtn{background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);color:#fff;width:52px;height:52px;padding:0;border-radius:14px;font-size:20px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

.sr{position:relative;flex:1;min-width:0;order:3;width:100%}
@media(min-width:700px){.sr{order:0;width:auto}}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:#111;border:1px solid var(--bd);
  border-radius:12px;display:none;z-index:30;max-height:60vh;overflow-y:auto;box-shadow:0 12px 32px #000a}
.dd div{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.dd div:active,.dd div:hover{background:var(--hi)}
.dd small{color:var(--mu)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media(max-width:520px){.grid{grid-template-columns:1fr;gap:12px}}
.mc{overflow:hidden;display:flex;flex-direction:column}
.mc .im{aspect-ratio:16/9;background:#0a0a0a center/cover;cursor:pointer}
.mc .b{padding:12px}
.mc .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mc button{flex:1;padding:10px;font-size:13px;min-height:42px}

.sc{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:13px}
td.t{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}
tr.out td{opacity:.55}

@media(max-width:640px){
  table.rank th:nth-child(n+6),table.rank td:nth-child(n+6){display:none}
  table.rank th,table.rank td{padding:10px 6px;font-size:14px}
  table.rank td:nth-child(1){width:34px}
  table.list,table.list thead,table.list tbody,table.list tr,table.list th,table.list td{display:block;width:100%}
  table.list thead,table.list tr.h{display:none}
  table.list tr{background:rgba(26,26,26,.6);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  table.list td{border:0;padding:4px 0;white-space:normal;display:flex;justify-content:space-between;gap:12px;align-items:center}
  table.list td::before{content:attr(data-l);color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.04em}
}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:420px){.two{grid-template-columns:1fr}}
.hist{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  max-width:calc(100% - 32px);background:var(--hi);border:1px solid var(--bd);padding:12px 18px;border-radius:12px;
  display:none;z-index:50;box-shadow:0 10px 30px #000a;text-align:center}
.menu{position:relative}
.menu-panel{position:absolute;right:0;top:calc(100% + 8px);background:#111;border:1px solid var(--bd);
  border-radius:12px;padding:6px;min-width:200px;display:none;z-index:40;box-shadow:0 12px 32px #000c;flex-direction:column;gap:4px}
.menu-panel.open{display:flex}
.menu-panel button{width:100%;justify-content:flex-start;background:transparent;border:0;border-radius:8px;padding:12px;min-height:44px}
.menu-panel button:hover,.menu-panel button:active{background:var(--hi)}
.menu-panel .sep{height:1px;background:var(--bd);margin:4px 2px}
.hero{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
@media(max-width:520px){h1{font-size:22px !important}.card{padding:14px}.w{padding:12px}}

/* toggle ngày */
.date-toggle{display:flex;gap:8px;margin-top:6px}
.date-toggle button{flex:1;background:var(--hi);border:1px solid var(--bd);color:var(--tx);
  font-weight:600;padding:10px;min-height:42px;font-size:14px}
.date-toggle button.on{background:var(--red);border-color:var(--red);color:#fff}
.date-wrap{margin-top:8px}

/* bảng điểm giải R1-R9 */
.tt th,.tt td{text-align:center;white-space:nowrap;padding:8px 10px;vertical-align:top;border-bottom:1px solid var(--bd)}
.tt td:first-child,.tt th:first-child{position:sticky;left:0;background:#141414;text-align:left;z-index:1;border-right:1px solid var(--bd)}
.tt small{font-size:12px}

/* trạng thái online */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#555;margin-right:8px;vertical-align:middle}
.dot.on{background:#22c55e;box-shadow:0 0 8px #22c55e}
.ost.on{color:#22c55e;font-weight:700}
</style>
</head>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nz=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const slugify=s=>nz(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fmt=ms=>[Math.floor(ms/6e4),Math.floor(ms%6e4/1e3),Math.floor(ms%1e3/10)].map(n=>String(n).padStart(2,'0')).join(':');
function parse(t){
  t=t.trim();
  if(/^\d{6}$/.test(t))t=t.slice(0,2)+':'+t.slice(2,4)+':'+t.slice(4);
  const p=t.split(':').map(Number);
  if(p.length!=3||p.some(n=>isNaN(n)||n<0)||p[1]>59||p[2]>99)return 0;
  return p[0]*6e4+p[1]*1e3+p[2]*10
}
const fd=d=>d?new Date(d+'T00:00:00').toLocaleDateString('vi-VN'):'';
const fdt=d=>d?new Date(d).toLocaleDateString('vi-VN'):'';
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',m.length>40?7000:3000)};
const st=n=>n?'★'.repeat(n):'';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);

const vnDate=iso=>{if(!iso)return'';const[a,b,c]=String(iso).slice(0,10).split('-');return `${c}/${b}/${a}`};
function parseVN(s){
  s=String(s).trim();
  if(!/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s))return '';
  let[d,m,y]=s.split('/').map(Number);
  if(m<1||m>12||d<1||d>31||y<1900||y>2100)return '';
  const dt=new Date(y,m-1,d);
  if(dt.getFullYear()!=y||dt.getMonth()!=m-1||dt.getDate()!=d)return '';
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`
}

const rn=id=>racers.find(r=>r.id==id)?.name||'?';
const mname=id=>maps.find(m=>m.id==id)?.name||'?';
const pts=a=>a.reduce((s,e)=>s+e.points,0);

/* ---------- đăng nhập ---------- */
async function boot(){
  const{data:{session}}=await sb.auth.getSession();
  session?start(session.user):authView()
}
function authView(reg){
  app.innerHTML=`<div class="w" style="max-width:400px;padding-top:6vh">
    <img class="logo-big" src="${LOGO}" alt="Dictator">
    <p class="mu">${reg?'Tạo tài khoản bằng tên đăng nhập, không cần email.':'Đăng nhập để xem bảng điểm.'}</p>
    <div class="card">
      <input id="u" placeholder="Tên đăng nhập (a-z, 0-9, _)" autocomplete="username" autocapitalize="none">
      <div style="height:10px"></div>
      <input id="p" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" autocomplete="${reg?'new':'current'}-password">
      <div class="two">
        <button onclick="auth(${!!reg})">${reg?'Tạo tài khoản':'Đăng nhập'}</button>
        <button class="g" onclick="authView(${!reg})">${reg?'Đã có tài khoản':'Tạo tài khoản mới'}</button>
      </div>
    </div>
  </div>`
}
async function auth(reg){
  const u=document.getElementById('u').value.trim().toLowerCase(),password=document.getElementById('p').value;
  if(!/^[a-z0-9_]{3,32}$/.test(u))return toast('Tên đăng nhập 3-32 ký tự a-z, 0-9, _');
  const email=u+'@dictator.local';let r;
  if(reg){
    r=await sb.auth.signUp({email,password});if(r.error)return toast(r.error.message);
    if(!r.data.session)return toast('Hãy tắt "Confirm email" trong Supabase (Authentication > Providers > Email).');
  }else{
    r=await sb.auth.signInWithPassword({email,password});
    if(r.error){const o=await sb.auth.signInWithPassword({email:u+'@shk.local',password});if(o.error)return toast('Sai tên đăng nhập hoặc mật khẩu.');r=o}
  }
  start(r.data.user)
}
async function load(){
  const[a,b,c]=await Promise.all([
    sb.from('rc_maps').select('*').order('difficulty',{ascending:false,nullsFirst:false}).order('name'),
    sb.from('rc_racers').select('*').order('name'),
    sb.from('rc_current').select('*')
  ]);
  const er=a.error||b.error||c.error;if(er)toast('Lỗi dữ liệu: '+er.message);
  maps=a.data||[];racers=b.data||[];cur=c.data||[]
}
async function start(user){
  const{data}=await sb.from('rc_profiles').select('*').eq('id',user.id).maybeSingle();
  me=data||{id:user.id,username:'?',role:'viewer'};
  await load();shell();home();startPresence()
}
async function refreshMe(){
  if(!me||!me.id)return;
  const{data}=await sb.from('rc_profiles').select('*').eq('id',me.id).maybeSingle();
  if(data&&data.role!==me.role){me=data;await load();shell();home();toast('Quyền của bạn đã đổi thành: '+data.role)}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshMe()});
document.addEventListener('click',e=>{
  if(!e.target.closest('.sr'))document.querySelectorAll('.dd').forEach(d=>d.style.display='none');
  if(!e.target.closest('.menu'))closeMenu();
});

/* ---------- khung trang ---------- */
function shell(){
  app.innerHTML=`
  <header><div class="w">
    <div class="brandbox" onclick="home()" title="Về trang chủ"><img class="logo" src="${LOGO}" alt="Dictator"><img class="wm" src="${WORDMARK}" alt="DICTATOR"></div>
    <div class="spacer"></div>
    <div class="menu">
      <button class="iconbtn" onclick="toggleMenu(event)" aria-label="Menu">☰</button>
      <div class="menu-panel" id="menuPanel">
        <button onclick="closeMenu();giai()">🏆 Giải đấu</button>
        ${staff()?'<button onclick="closeMenu();addMapView()">🗺 Thêm map</button>':''}
        ${staff()?'<button onclick="closeMenu();entry()">📝 Nhập kỷ lục</button><button onclick="closeMenu();backups()">🗄 Bản lưu trước</button><button onclick="closeMenu();members()">👥 Thành viên</button>':''}
        <div class="sep"></div>
        <button disabled style="opacity:.6">👤 ${esc(me.username)} (${esc(me.role)})</button>
        <button onclick="logout()">🚪 Thoát</button>
      </div>
    </div>
    <div class="sr">
      <input id="q" placeholder="Tìm tay đua hoặc map..." oninput="sugg()" onfocus="sugg()" autocomplete="off" autocapitalize="none">
      <div class="dd" id="dd"></div>
    </div>
  </div></header>
  <main class="w" id="v"></main>`
}
async function logout(){
  closeMenu();
  try{if(pch){sb.removeChannel(pch);pch=null}}catch(e){}
  try{await Promise.race([sb.auth.signOut({scope:'local'}),new Promise(r=>setTimeout(r,1500))])}catch(e){}
  try{Object.keys(localStorage).filter(k=>k.startsWith('sb-')).forEach(k=>localStorage.removeItem(k));Object.keys(sessionStorage).filter(k=>k.startsWith('sb-')).forEach(k=>sessionStorage.removeItem(k))}catch(e){}
  me=null;location.reload()
}
function toggleMenu(e){e.stopPropagation();menuOpen=!menuOpen;document.getElementById('menuPanel').classList.toggle('open',menuOpen)}
function closeMenu(){menuOpen=false;const p=document.getElementById('menuPanel');if(p)p.classList.remove('open')}
const V=h=>{document.getElementById('v').innerHTML=h;document.getElementById('dd').style.display='none';scrollTo(0,0)};

function sugg(){
  const q=nz(document.getElementById('q').value.trim()),dd=document.getElementById('dd');
  if(!q){dd.style.display='none';return}
  const r=racers.filter(x=>nz(x.name+' '+x.slug).includes(q)).slice(0,6).map(x=>{
    const e=cur.filter(c=>c.racer_id==x.id);
    return`<div onclick="showRacer('${x.id}')"><span>🏎 ${esc(x.name)}</span><small>${e.length} rec · <b class="gold">${pts(e)}</b> điểm</small></div>`
  });
  const m=maps.filter(x=>nz(x.name).includes(q)).slice(0,6).map(x=>`<div onclick="showMap('${x.id}')"><span>🗺 ${esc(x.name)}</span><small>Top 5</small></div>`);
  dd.innerHTML=r.concat(m).join('')||'<div class="mu">Không tìm thấy kết quả.</div>';
  dd.style.display='block'
}

/* ---------- trang chủ ---------- */
function rankList(){
  const m={};
  cur.forEach(e=>{const o=m[e.racer_id]||(m[e.racer_id]={id:e.racer_id,p:0,n:0,r:[0,0,0,0,0]});o.p+=e.points;o.n++;o.r[e.rank-1]++});
  return Object.values(m).sort((a,b)=>b.p-a.p||b.r[0]-a.r[0]||b.n-a.n||rn(a.id).localeCompare(rn(b.id)))
}
function rankTable(L){
  return`<div class="sc"><table class="rank">
      <tr><th>#</th><th>Tay đua</th><th>Điểm</th><th>Rec</th><th>T1</th><th>T2</th><th>T3</th><th>T4</th><th>T5</th></tr>
      ${L.map((o,i)=>`<tr style="cursor:pointer" onclick="showRacer('${o.id}')">
        <td class="gold">${i+1}</td><td><b>${esc(rn(o.id))}</b></td><td class="gold">${o.p}</td><td>${o.n}</td>
        ${o.r.map(n=>`<td class="${n?'':'mu'}">${n}</td>`).join('')}
      </tr>`).join('')}
    </table></div>`
}
function board(){
  const L=rankList();
  if(!L.length)return'';
  return`<div class="card">
    <h2 style="font-size:18px">Xếp hạng tay đua</h2>
    <p class="mu" style="margin:2px 0 10px">Điểm tính tự động từ top 5 thời gian nhanh nhất của mỗi map: Top 1 = 5 điểm, Top 2 = 4, Top 3 = 3, Top 4 = 2, Top 5 = 1.</p>
    ${rankTable(L.slice(0,5))}
    ${L.length>5?`<div onclick="allRank()" style="margin-top:12px;padding:12px;text-align:center;background:var(--hi);border:1px solid var(--bd);border-radius:12px;cursor:pointer;font-weight:700">Xem tất cả ${L.length} tay đua →</div>`:''}
  </div>`
}
function allRank(){
  const L=rankList();
  V(`<div class="card">
    <h2 style="font-size:22px">Xếp hạng toàn bộ tay đua <span class="gold">${L.length}</span></h2>
    <p class="mu" style="margin:2px 0 10px">Top 1 = 5 điểm, Top 2 = 4, Top 3 = 3, Top 4 = 2, Top 5 = 1. Nhấn vào một tay đua để xem chi tiết.</p>
    ${L.length?rankTable(L):'<p class="mu">Chưa có tay đua nào.</p>'}
    <div class="hist"><button class="g" onclick="home()">← Về trang chủ</button></div>
  </div>`)
}
function home(){
  V(`<div class="hero" style="margin:10px 0 16px">
      <h1 style="font-size:26px"><span style="color:var(--red)">Bảng điểm</span> tay đua</h1>
      ${staff()?`<div class="hist" style="margin:0">
        <button class="g" style="${delMode?'border-color:var(--red);color:var(--red)':''}" onclick="delMode=!delMode;home()">🗑 Xóa map: ${delMode?'BẬT':'TẮT'}</button>
        <button class="d" onclick="delAllRecs()">🗑 Xóa toàn bộ kỷ lục</button>
        <button class="g" onclick="backups()">🗄 Bản lưu trước</button>
      </div>`:''}
    </div>
    ${board()}
    ${maps.length?'':'<p class="mu">Chưa có map. '+(staff()?'Vào "Nhập kỷ lục" để thêm map đầu tiên.':'Hãy chờ admin thêm map.')+'</p>'}
    <div class="grid">
      ${maps.map(m=>`<div class="mc">
        <div class="im" style="${m.image_url?`background-image:url('${esc(m.image_url)}')`:''}" onclick="showMap('${m.id}')"></div>
        <div class="b">
          <b>${esc(m.name)}</b> <span class="gold">${st(m.difficulty)}</span>
          <div class="actions">
            <button onclick="showMap('${m.id}')">Top 5</button>
            ${delMode?`<button class="d" onclick="delMap('${m.id}')">Xóa</button>`:''}
          </div>
        </div>
      </div>`).join('')}
    </div>`)
}
async function delMap(id){
  const m=maps.find(x=>x.id==id);
  if(!staff()||!confirm(`Xóa map "${m.name}" cùng toàn bộ kỷ lục của map này? Không thể hoàn tác.`))return;
  const{data,error}=await sb.from('rc_maps').delete().eq('id',id).select();
  if(error)return toast(error.message);
  if(!data.length)return toast('Không xóa được: bạn chưa có quyền admin.');
  await load();toast(`Đã xóa map "${m.name}".`);home()
}

/* ---------- XÓA TOÀN BỘ KỶ LỤC + BẢN LƯU TRƯỚC ---------- */
async function fetchAllRecords(){
  const out=[];
  for(let from=0;;from+=1000){
    const{data,error}=await sb.from('rc_records').select('*').order('created_at').order('id').range(from,from+999);
    if(error)throw error;
    out.push(...data);
    if(data.length<1000)break;
  }
  return out
}
async function delAllRecs(){
  if(!staff())return;
  let rows;try{rows=await fetchAllRecords()}catch(e){return toast(e.message)}
  if(!rows.length)return toast('Chưa có kỷ lục nào để xóa.');
  if(!confirm(`Xóa TOÀN BỘ ${rows.length} kỷ lục của mọi map?\n\nBảng xếp hạng và top 5 sẽ trống. Kỷ lục được chuyển vào "Bản lưu trước" và có thể khôi phục.`))return;
  const b=await sb.from('rc_backups').insert({note:`Xóa toàn bộ kỷ lục · ${me.username}`,record_count:rows.length,data:rows}).select('id').single();
  if(b.error)return toast(/rc_backups/.test(b.error.message)?'Chưa tạo bảng rc_backups trong Supabase, hãy chạy file SQL trước.':'Không tạo được bản lưu nên chưa xóa: '+b.error.message);
  const d=await sb.from('rc_records').delete().not('id','is',null);
  if(d.error){await sb.from('rc_backups').delete().eq('id',b.data.id);return toast(d.error.message)}
  const left=await sb.from('rc_records').select('id',{count:'exact',head:true});
  await load();
  if(left.count>=rows.length){
    await sb.from('rc_backups').delete().eq('id',b.data.id);
    toast('Không xóa được: bạn chưa có quyền admin.')
  }else if(left.count>0)toast(`Chỉ xóa được một phần (còn ${left.count} kỷ lục).`);
  else toast(`Đã xóa ${rows.length} kỷ lục và lưu vào Bản lưu trước.`);
  home()
}
async function backups(){
  if(!staff())return;
  const{data,error}=await sb.from('rc_backups').select('id,created_at,note,record_count').order('created_at',{ascending:false});
  if(error)return toast(/rc_backups/.test(error.message)?'Chưa tạo bảng rc_backups trong Supabase, hãy chạy file SQL trước.':error.message);
  V(`<div class="card"><h2>Bản lưu trước</h2>
    <p class="mu">Kỷ lục bị xóa toàn bộ được lưu ở đây. Bạn có thể khôi phục hoặc xóa vĩnh viễn từng bản lưu.</p>
    ${data.length?`<div class="sc"><table class="list">
      <tr class="h"><th>Thời gian</th><th>Nội dung</th><th>Số kỷ lục</th><th></th></tr>
      ${data.map(b=>`<tr>
        <td data-l="Thời gian">${new Date(b.created_at).toLocaleString('vi-VN')}</td>
        <td data-l="Nội dung">${esc(b.note||'—')}</td>
        <td data-l="Số kỷ lục" class="t">${b.record_count}</td>
        <td data-l=""><span style="display:flex;gap:8px">
          <button class="g" style="min-height:38px;padding:8px 12px;font-size:13px" onclick="restoreBackup('${b.id}')">♻ Khôi phục</button>
          <button class="d" style="min-height:38px;padding:8px 12px;font-size:13px" onclick="delBackup('${b.id}')">Xóa</button></span></td>
      </tr>`).join('')}
    </table></div>`:'<p class="mu">Chưa có bản lưu nào.</p>'}
    <div class="hist"><button class="g" onclick="home()">← Về trang chủ</button></div>
  </div>`)
}
async function restoreBackup(id){
  if(!staff())return;
  const{data,error}=await sb.from('rc_backups').select('*').eq('id',id).maybeSingle();
  if(error)return toast(error.message);
  if(!data)return toast('Không tìm thấy bản lưu.');
  const mi=new Set(maps.map(m=>m.id)),ri=new Set(racers.map(r=>r.id));
  const ok=data.data.filter(r=>mi.has(r.map_id)&&ri.has(r.racer_id)),skip=data.data.length-ok.length;
  if(!ok.length)return toast('Không khôi phục được: map hoặc tay đua của bản lưu này đã bị xóa.');
  if(!confirm(`Khôi phục ${ok.length} kỷ lục${skip?` (bỏ qua ${skip} kỷ lục vì map đã bị xóa)`:''}?\nKỷ lục hiện có được giữ nguyên, kỷ lục trùng sẽ lấy theo bản lưu.`))return;
  for(let i=0;i<ok.length;i+=500){
    const{error}=await sb.from('rc_records').upsert(ok.slice(i,i+500),{onConflict:'id'});
    if(error)return toast('Lỗi khi khôi phục: '+error.message)
  }
  await load();toast(`Đã khôi phục ${ok.length} kỷ lục.`);backups()
}
async function delBackup(id){
  if(!staff()||!confirm('Xóa vĩnh viễn bản lưu này? Không thể hoàn tác.'))return;
  const{data,error}=await sb.from('rc_backups').delete().eq('id',id).select('id');
  if(error)return toast(error.message);
  if(!data.length)return toast('Không xóa được: bạn chưa có quyền admin.');
  toast('Đã xóa bản lưu.');backups()
}

/* ---------- trang map ---------- */
async function showMap(id){
  CV={map:id};const m=maps.find(x=>x.id==id);
  const rows=cur.filter(c=>c.map_id==id).sort((a,b)=>a.rank-b.rank);
  V(`<div class="card">
    <h1 style="font-size:22px">${esc(m.name)} <span class="gold">${st(m.difficulty)}</span></h1>
    <p class="mu">Top 5 thời gian nhanh nhất.</p>
    ${rows.length?`<div class="sc"><table class="list">
      <tr class="h"><th>#</th><th>Tay đua</th><th>Kỷ lục</th><th>Xe · Pet</th><th>Ngày</th></tr>
      ${rows.map(e=>`<tr>
        <td data-l="Hạng" class="gold">${e.rank}</td>
        <td data-l="Tay đua"><b>${esc(rn(e.racer_id))}</b> <small class="mu">+${e.points}</small></td>
        <td data-l="Kỷ lục" class="t">${fmt(e.time_ms)}</td>
        <td data-l="Xe · Pet">${esc(e.car||'—')} · ${esc(e.pet||'—')}</td>
        <td data-l="Ngày">${fd(e.posted_on)||fdt(e.created_at)}${staff()?` <button class="x e" title="Sửa" onclick="editRec('${e.id}')">✎</button><button class="x" title="Xóa kỷ lục" onclick="delRec('${e.id}')">✕</button>`:''}</td>
      </tr>`).join('')}
    </table></div>`:'<p class="mu">Map này chưa có kỷ lục.</p>'}
    <div class="hist">
      <button class="g" onclick="showHistory('${id}')">🕘 Tất cả kỷ lục đã nhập</button>
      ${staff()?`<button class="g" onclick="entry('${id}')">📝 Nhập kỷ lục cho map này</button>`:''}
    </div>
  </div>`)
}
async function showHistory(id){
  const m=maps.find(x=>x.id==id);
  const{data,error}=await sb.from('rc_records').select('*').eq('map_id',id).order('time_ms').order('created_at');
  if(error)return toast(error.message);
  const top=new Set(cur.filter(c=>c.map_id==id).map(c=>c.id));
  V(`<div class="card">
    <h1 style="font-size:22px">${esc(m.name)} <span class="gold">${st(m.difficulty)}</span></h1>
    <p class="mu">Mọi kỷ lục đã nhập, nhanh nhất trước. Dòng mờ là kỷ lục không nằm trong top 5.</p>
    ${data.length?`<div class="sc"><table class="list">
      <tr class="h"><th>Tay đua</th><th>Kỷ lục</th><th>Xe · Pet</th><th>Ngày</th></tr>
      ${data.map(e=>`<tr class="${top.has(e.id)?'':'out'}">
        <td data-l="Tay đua"><b>${esc(rn(e.racer_id))}</b></td>
        <td data-l="Kỷ lục" class="t">${fmt(e.time_ms)}</td>
        <td data-l="Xe · Pet">${esc(e.car||'—')} · ${esc(e.pet||'—')}</td>
        <td data-l="Ngày">${fd(e.posted_on)||fdt(e.created_at)}${staff()?` <button class="x e" title="Sửa" onclick="editRec('${e.id}',1)">✎</button><button class="x" title="Xóa" onclick="delRec('${e.id}',1)">✕</button>`:''}</td>
      </tr>`).join('')}
    </table></div>`:'<p class="mu">Chưa có kỷ lục nào.</p>'}
    <div class="hist"><button class="g" onclick="showMap('${id}')">← Về top 5</button></div>
  </div>`)
}
async function delRec(id,fromHist){
  if(!staff()||!confirm('Xóa kỷ lục này? Top 5 sẽ tự xếp lại (kỷ lục chậm hơn của cùng người, nếu có, sẽ thay thế).'))return;
  const{data,error}=await sb.from('rc_records').delete().eq('id',id).select();
  if(error)return toast(error.message);
  if(!data.length)return toast('Không xóa được: bạn chưa có quyền admin.');
  await load();toast('Đã xóa kỷ lục.');
  fromHist?showHistory(CV.map):showMap(CV.map)
}

/* ---------- sửa kỷ lục ---------- */
async function editRec(id,fromHist){
  if(!staff())return;
  const{data:e,error}=await sb.from('rc_records').select('*').eq('id',id).maybeSingle();
  if(error)return toast(error.message);
  if(!e)return toast('Không tìm thấy kỷ lục.');
  CV.map=e.map_id;
  const isoDate=e.posted_on||e.created_at.slice(0,10);
  V(`<div class="card">
    <h2>Sửa kỷ lục</h2>
    <p class="mu">${esc(rn(e.racer_id))} · ${esc(mname(e.map_id))}</p>
    <div class="two">
      <div><small class="mu">Ngày (dd/mm/yyyy)</small>
        <input id="ed" value="${vnDate(isoDate)}" placeholder="dd/mm/yyyy" inputmode="numeric" autocomplete="off">
      </div>
      <div><small class="mu">Thời gian</small>
        <input id="et" value="${fmt(e.time_ms)}" inputmode="numeric" placeholder="MM:SS:mm">
      </div>
      <div><small class="mu">Xe</small><input id="ec" value="${esc(e.car||'')}"></div>
      <div><small class="mu">Pet</small><input id="ep" value="${esc(e.pet||'')}"></div>
    </div>
    <div class="hist">
      <button onclick="saveEdit('${id}',${fromHist?1:0})">💾 Lưu thay đổi</button>
      <button class="g" onclick="${fromHist?`showHistory('${e.map_id}')`:`showMap('${e.map_id}')`}">Hủy</button>
    </div>
  </div>`)
}
async function saveEdit(id,fromHist){
  const g=k=>document.getElementById(k).value.trim();
  const ms=parse(g('et'));if(!ms)return toast('Thời gian cần dạng MM:SS:mm.');
  const iso=parseVN(g('ed'));

function setDateMode(mode){
  const t=document.getElementById('dtToday'),
        m=document.getElementById('dtManual'),
        wrap=document.getElementById('dateWrap'),
        d=document.getElementById('d'),
        hidden=document.getElementById('dValue');
  if(mode=='today'){
    t.classList.add('on');m.classList.remove('on');
    wrap.style.display='none';
    hidden.value=today();
  }else{
    m.classList.add('on');t.classList.remove('on');
    wrap.style.display='block';
    if(!d.value)d.value=vnDate(today());
    const iso=parseVN(d.value);
    if(iso)hidden.value=iso;
    d.focus();
  }
}
document.addEventListener('input',e=>{
  if(e.target.id!=='d')return;
  const iso=parseVN(e.target.value);
  const hidden=document.getElementById('dValue');
  if(hidden)hidden.value=iso||'';
});

function mapSugg(typed){
  if(typed)em='';
  const q=nz(document.getElementById('emq').value.trim()),dd=document.getElementById('edd');
  const r=maps.filter(m=>!q||nz(m.name).includes(q)).slice(0,8);
  dd.innerHTML=r.map(m=>`<div onclick="pickMap('${m.id}')"><span>🗺 ${esc(m.name)}</span><small class="gold">${st(m.difficulty)}</small></div>`).join('')||'<div class="mu">Không tìm thấy map.</div>';
  dd.style.display='block'
}
function pickMap(id){
  em=id;
  document.getElementById('emq').value=mname(id);
  document.getElementById('edd').style.display='none';

}
function preview(id){
  const e=cur.filter(c=>c.map_id==id).sort((a,b)=>a.rank-b.rank);
  document.getElementById('pv').innerHTML=`<h2 style="font-size:17px">Top 5 hiện tại: ${esc(mname(id))}</h2>`+
    (e.length?`<div class="sc"><table class="list">
      <tr class="h"><th>#</th><th>Tay đua</th><th>Kỷ lục</th><th>Điểm</th></tr>

        <td data-l="Hạng" class="gold">${x.rank}</td>
        <td data-l="Tay đua"><b>${esc(rn(x.racer_id))}</b></td>

async function save(){
  if(!em){const f=maps.find(m=>nz(m.name)==nz(document.getElementById('emq').value));if(f)em=f.id}
  if(!em)return toast('Hãy chọn map từ gợi ý.');
  const g=k=>document.getElementById(k).value.trim();
  const name=g('r').replace(/\s+/g,' ');if(!name)return toast('Cần nhập tên tay đua.');
  const ms=parse(g('t'));if(!ms)return toast('Kỷ lục cần dạng MM:SS:mm (ví dụ 01:23:45).');

  let dateVal=document.getElementById('dValue').value;
  const manual=document.getElementById('dtManual').classList.contains('on');
  if(manual){
    const iso=parseVN(document.getElementById('d').value);
    if(!iso)return toast('Ngày không hợp lệ. Nhập dạng dd/mm/yyyy, ví dụ 05/03/2025.');
    dateVal=iso;
  }
  if(!dateVal)return toast('Cần chọn ngày đăng.');

  const{data,error}=await sb.rpc('rc_add_record',{
    p_map:em,p_name:name,p_ms:ms,p_car:g('c'),p_pet:g('p'),p_date:dateVal
  });
  if(error)return toast(error.message);
  await load();
  if(data.status=='slower')toast(`${data.racer} đã có kỷ lục ${fmt(data.best)} nhanh hơn hoặc bằng, không lưu.`);
  else if(data.status=='out')toast(`Đã lưu ${fmt(ms)} nhưng chưa vào top 5 (hạng ${data.rank}).`);
  else toast(`Đã lưu: ${data.racer} hạng ${data.rank} (+${6-data.rank} điểm)${data.new_racer?' · tay đua mới':''}`);
  if(data.new_racer){document.getElementById('rl').innerHTML=racers.map(r=>`<option value="${esc(r.name)}">`).join('')}
  if(data.status!='slower'){
    ['r','t','c','p'].forEach(k=>document.getElementById(k).value='');
    setDateMode('today');
  }
  preview(em)
}

/* xếp 4 tay đua từ nhanh đến chậm, gắn nhãn Top + điểm (Top 1 = 5, Top 2 = 4, Top 3 = 3, Top 4 = 2) */
window.sortRound=function(){
  if(!document.getElementById('n0'))return;
  const rows=[0,1,2,3].map(i=>({i,n:g('n'+i),t:g('t'+i),c:g('c'+i),p:g('p'+i),ms:parse(g('t'+i))}))
    .filter(x=>x.n||x.t)
    .sort((a,b)=>(a.ms||Infinity)-(b.ms||Infinity)||a.i-b.i);
  const s=(k,v)=>document.getElementById(k).value=v;
  for(let i=0;i<4;i++){
    const x=rows[i],lb=document.getElementById('lb'+i);
    s('n'+i,x?x.n:'');s('t'+i,x?(x.ms?fmt(x.ms):x.t):'');s('c'+i,x?x.c:'');s('p'+i,x?x.p:'');
    lb.textContent=x&&x.ms?`Top ${i+1} · +${5-i} điểm`:`Tay đua ${i+1}`
  }
};
/* tự xếp khi rời khỏi một khối tay đua (tránh đổi chỗ giữa lúc đang gõ xe/pet) */
document.addEventListener('focusout',e=>{
  const b=e.target.closest&&e.target.closest('.rb');if(!b)return;
  if(e.relatedTarget&&b.contains(e.relatedTarget))return;
  sortRound()
});
window.fillRound=function(){
  const n=+g('rd'),rows=RES.filter(r=>r.round_no==n).sort((a,b)=>a.rank-b.rank),s=(k,v)=>document.getElementById(k).value=v;
  for(let i=0;i<4;i++){const x=rows[i];s('n'+i,x?rn(x.racer_id):'');s('t'+i,x?fmt(x.time_ms):'');s('c'+i,x?.car||'');s('p'+i,x?.pet||'')}
  sortRound();
  if(rows.length)pickMap(rows[0].map_id)
};
window.saveRound=async function(){
  sortRound();
  if(!em){const f=maps.find(m=>nz(m.name)==nz(g('emq')));if(f)em=f.id}
  if(!em)return toast('Hãy chọn map từ gợi ý.');
  const rd=+g('rd'),iso=parseVN(g('dt'));if(!iso)return toast('Ngày không hợp lệ, nhập dạng dd/mm/yyyy.');
  const rows=[],seen=new Set();
  for(let i=0;i<4;i++){
    const n=g('n'+i).replace(/\s+/g,' '),t=g('t'+i);if(!n&&!t)continue;
    if(!n)return toast(`Tay đua ${i+1}: thiếu tên.`);
    const ms=parse(t);if(!ms)return toast(`Tay đua ${i+1}: kỷ lục cần dạng MM:SS:mm.`);
    if(seen.has(nz(n)))return toast(`${n} bị nhập trùng.`);seen.add(nz(n));
    rows.push({n,ms,c:g('c'+i),p:g('p'+i)})
  }
  if(!rows.length)return toast('Cần nhập ít nhất 1 tay đua.');
  for(const x of rows){
    const{error}=await sb.rpc('rc_add_record',{p_map:em,p_name:x.n,p_ms:x.ms,p_car:x.c,p_pet:x.p,p_date:iso});
    if(error)return toast(`${x.n}: ${error.message}`)
  }
  await load();
  const arr=rows.map(x=>({racer_id:racers.find(r=>nz(r.name)==nz(x.n))?.id,time_ms:x.ms,car:x.c,pet:x.p}));
  if(arr.some(a=>!a.racer_id))return toast('Không tìm thấy tay đua vừa thêm, hãy bấm Lưu lại.');
  const{error}=await sb.rpc('rc_save_round',{p_tour:TID,p_round:rd,p_map:em,p_rows:arr});
  if(error)return toast(error.message);
  toast(`Đã lưu R${rd}.`);giai()
};
window.delRound=async function(){
  const n=+g('rd');if(!confirm(`Xóa kết quả R${n} khỏi giải? Kỷ lục trong top 5 của map vẫn giữ nguyên.`))return;
  const{data,error}=await sb.from('rc_tour_results').delete().eq('tournament_id',TID).eq('round_no',n).select();
  if(error)return toast(error.message);if(!data.length)return toast(`R${n} chưa có dữ liệu để xóa.`);
  toast(`Đã xóa R${n}.`);giai()
};

/* helper dùng chung cho entryRound */
const g=k=>document.getElementById(k).value.trim();

/* ---------- khởi động ---------- */
boot();
</script>
